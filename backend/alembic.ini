# Alembic configuration for MarketMind AI.
# The database URL is injected at runtime: from the DATABASE_URL environment
# variable (see migrations/env.py), or programmatically when the app runs the
# migration at startup (backend/app/migrate.py).

[alembic]
script_location = migrations
prepend_sys_path = .
# Leave empty — migrations/env.py resolves it from DATABASE_URL
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
