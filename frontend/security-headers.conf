# Security response headers, kept in one file because nginx does NOT merge
# `add_header` across levels: a location that declares its own add_header (the
# /assets/ cache block below) drops every server-level one. That block therefore
# `include`s this file too, so the headers survive on cached assets.
#
# `always` makes them apply to error responses (4xx/5xx) as well as 200s — an
# attacker-triggerable 404 is exactly where a missing nosniff hurts.

# Stop the browser from re-interpreting a response as a different type
# (an uploaded .png that is really HTML is the classic path to stored XSS).
add_header X-Content-Type-Options "nosniff" always;

# Clickjacking: this app must not be framed by another site. Paired with the
# frame-ancestors directive below for browsers that prefer CSP.
add_header X-Frame-Options "SAMEORIGIN" always;

# Do not leak the full URL (which can contain ids) to third-party origins.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Nothing in the app needs these device APIs, so deny them outright.
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;

# Isolate the browsing context from cross-origin windows (tab-nabbing).
add_header Cross-Origin-Opener-Policy "same-origin" always;

# A deliberately conservative CSP: it hardens the three directives that need no
# per-asset tuning (no plugins, no <base> hijack, no framing) while leaving
# script-src/style-src/connect-src alone — a full policy has to be tested
# against the built bundle (Leaflet tiles, the inline dark-mode bootstrap
# script in index.html) before it can be enabled, see
# SECURITY_AND_DEPLOYMENT_REVIEW.md.
add_header Content-Security-Policy "object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

# Only meaningful when TLS terminates in front of this container. Harmless when
# nginx answers plain HTTP (browsers ignore HSTS received over http).
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
