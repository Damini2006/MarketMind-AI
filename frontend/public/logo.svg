      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="chart" x1="30" y1="85" x2="90" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="120" height="120" rx="28" fill="url(#bg)"/>
  <!-- Stylized M with ascending bar chart -->
  <path d="M30 82 L30 42 L48 42 L60 62 L72 42 L90 42 L90 82 L78 82 L78 58 L66 78 L54 58 L42 78 L42 82 Z" fill="white" opacity="0.95"/>
