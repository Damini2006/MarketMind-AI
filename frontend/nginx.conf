server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml+rss;

    # File Upload size limit
    client_max_body_size 50M;

    # Security response headers (nosniff, frame-options, HSTS, a minimal CSP...).
    # Shared file so the cached-asset location below can include it too.
    include /etc/nginx/security-headers.conf;

    # ── Backend location ─────────────────────────────────────────────────────
    # Docker's embedded DNS server. It is needed because every proxy_pass below
    # is written with a VARIABLE, which moves host-name resolution from
    # config-load time to request time.
    #
    # Why that matters: with a literal `proxy_pass http://backend:8000/...`,
    # nginx resolves that name once while reading this file and then REFUSES TO
    # START if it does not exist:
    #
    #     [emerg] host not found in upstream "backend"
    #
    # which made the published image useless outside compose — running it
    # standalone served nothing at all, not even the static SPA. Resolving per
    # request means the container always starts and always serves the SPA; only
    # a proxied path fails (502) while no backend is reachable. Inside compose
    # this changes no behaviour the stack relies on — `depends_on:
    # service_healthy` already guarantees the backend is up before this one — and
    # it additionally picks up a recreated backend's new address within 10s
    # instead of pinning the address resolved at startup.
    #
    # Caveat, stated rather than hidden: 127.0.0.11 exists on a Docker
    # user-defined network. Run with `docker run` on the default bridge and
    # there is no resolver here, so the SPA still serves and proxied paths
    # answer 502 until the backend is reachable. On a non-Docker orchestrator
    # (e.g. Kubernetes) point this at that cluster's resolver (kube-dns).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # The single knob for the backend's host:port. Change it here to point the
    # image at a backend somewhere else.
    set $backend "backend:8000";

    # Health Probe Proxy
    location = /api/health {
        proxy_pass http://$backend/health$is_args$args;
        proxy_set_header Host $host;
    }

    location = /health {
        proxy_pass http://$backend/health$is_args$args;
        proxy_set_header Host $host;
    }

    # API Proxy (assumes frontend and backend are on same Docker network).
    # $request_uri is what the old literal form did implicitly: it forwards the
    # original path and query string unchanged, so /api/x?y=1 arrives at the
    # backend as /api/x?y=1 (with variable proxy_pass nginx does NOT re-append
    # the query string, hence spelling it out).
    location /api/ {
        proxy_pass http://$backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 60s;
    }

    # WebSocket Proxy for Live Alerts
    location /ws/ {
        proxy_pass http://$backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Uploads Static Files Proxy
    location /uploads/ {
        proxy_pass http://$backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA Client-Side Routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        # nginx replaces (does not merge) add_header at this level, so the
        # server-level security headers must be re-included here or they
        # silently disappear on every JS/CSS/image response.
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }
}
