name: Post-deploy smoke (public site)

# Every other gate in this repository looks at the working tree or a local
# stack: pytest, the Vite build, the image build and the compose smoke test. None
# of them can see the thing that actually broke here — the public URL serving a
# build from a different commit, and /api paths being answered by the SPA
# fallback with HTML. Both looked healthy from the outside: HTTP 200, a page that
# renders, and no error anywhere in CI.
#
# This runs on the same push that triggers the hosting build, waits for the
# promoted deployment to serve this commit's bundle, and fails loudly (with
# ::error:: annotations) if it does not.
#
# The bundle and anonymous API checks need no secrets at all. The authenticated
# page checks (Compare Periods, Funnel Analysis) do: they log in as a read-only
# demo account whose credentials live in repository secrets, because production
# does not seed the demo accounts and the raw endpoints they hit return every
# tenant's data only to a signed-in user. Without those secrets the script skips
# those checks with a ::warning:: annotation rather than failing the deploy —
# visible in the run, never counted as a pass.
#
# Kept to the production branch: on any other branch the public site is not
# supposed to change, so comparing it to that branch's build would be wrong.
# A schedule is the one trigger that can fire there on its own: GitHub runs
# scheduled workflows from the default branch only, and that is this branch, so
# the build a scheduled run compares against is the deployed one.

on:
  push:
    branches: [Rishika-Damini-Neelam]
  # Daily, not hourly: this is drift detection, not monitoring. A hosting-side
  # rollback, a CDN serving a stale bundle, or a demo credential that stopped
  # working then shows up within a day, with no commit and nothing else to
  # trigger it. A failure here means the deployment that was healthy yesterday
  # no longer answers as this branch's build.
  schedule:
    # Off the hour: GitHub's scheduler queues the :00 runs first.
    - cron: '23 6 * * *'
    # TEMPORARY: every 5 minutes, only to observe that a scheduled run fires.
    # Removed in the commit that follows.
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: post-deploy-smoke-${{ github.ref }}
  # A newer push supersedes an older check: the older one would be asserting
  # against a bundle that is no longer the newest build.
  cancel-in-progress: true

env:
  # Not hard-wired to one domain: set a repository variable to check another.
  PRODUCTION_URL: ${{ vars.PRODUCTION_URL || 'https://frontend-xi-ashy-73.vercel.app' }}
  # Read-only demo credentials for the authenticated page checks. Set them as
  # repository secrets, not variables: the password is a credential. They must
  # belong to a RESTRICTED account (the script asserts a write endpoint answers
  # 403) on a tenant that has data, since a page that loads and shows nothing is
  # exactly what these checks are for.
  #
  # Empty here means "not configured yet": the script skips the authenticated
  # checks with a warning. Setting only one of the two fails the run.
  POST_DEPLOY_DEMO_EMAIL: ${{ secrets.POST_DEPLOY_DEMO_EMAIL }}
  POST_DEPLOY_DEMO_PASSWORD: ${{ secrets.POST_DEPLOY_DEMO_PASSWORD }}

jobs:
  public-site:
    name: Public site serves this commit (bundle + API)
    runs-on: ubuntu-latest
    # Generous: most of it is the bundle check waiting for the deploy.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches ci.yml, so the bundle hashed here is the bundle the
          # deployment builds.
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build the frontend
        # Vite content-hashes the entry chunk, so this build's bundle name is an
        # exact fingerprint of this commit's frontend source.
        working-directory: frontend
        run: npm run build

      - name: Read this build's entry bundle
        id: bundle
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          bundle="$(grep -oE '/assets/index-[^\"]+\.js' dist/index.html | head -1)"
          if [ -z "$bundle" ]; then
            echo "::error::no entry bundle found in dist/index.html - the build output is not a Vite SPA shell"
            exit 1
          fi
          echo "this build's entry bundle: $bundle"
          echo "bundle=$bundle" >> "$GITHUB_OUTPUT"

      - name: Smoke check the public deployment
        # Fails if the live bundle is not this build, if the entry bundle is not
        # actually fetchable, if /api/sales/ is answered by the SPA fallback
        # (HTML) rather than by the backend (JSON, 401 when anonymous), or — with
        # the demo secrets set — if a read-only account cannot load the data
        # behind Compare Periods and Funnel Analysis.
        run: |
          args=(
            --url "$PRODUCTION_URL"
            --expected-bundle "${{ steps.bundle.outputs.bundle }}"
            --timeout 420
          )
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # On a push a missing secret is a warning: a deploy should not fail
            # because credentials were never configured. A scheduled run is the
            # opposite case - its whole job is to prove the checks still work,
            # so skipping the authenticated half would leave it green and empty.
            args+=(--require-demo-credentials)
          fi
          python3 scripts/post_deploy_smoke.py "${args[@]}"
