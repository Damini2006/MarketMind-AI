name: Post-deploy smoke (public site)

# Every other gate in this repository looks at the working tree or a local
# stack: pytest, the Vite build, the image build and the compose smoke test. None
# of them can see the thing that actually broke here — the public URL serving a
# build from a different commit, and /api paths being answered by the SPA
# fallback with HTML. Both looked healthy from the outside: HTTP 200, a page that
# renders, and no error anywhere in CI.
#
# This runs on the same push that triggers the hosting build, waits for the
# promoted deployment to serve this commit's bundle, and fails loudly (with
# ::error:: annotations) if it does not. It also probes every retired hostname
# declared in frontend/vercel.json and fails if one serves a build instead of
# redirecting to the canonical origin: a pinned alias serving a stale bundle is
# invisible from the canonical host, and that is how a two-day-old build was
# served here.
#
# The bundle and anonymous API checks need no secrets at all. The per-role
# access matrix does: it logs in as one account per role and asserts that role's
# row — the pages it may load, the pages it must be refused, and the writes it
# may or may not make. Those accounts live in repository secrets, because
# production does not seed the demo accounts and every endpoint in the matrix
# returns a tenant's data only to a signed-in user. A role without credentials is
# skipped with a ::warning:: annotation (visible in the run, never counted as a
# pass); a scheduled run instead names the roles it must be able to check, so a
# row that quietly vanished cannot leave the run green and empty.
#
# Kept to the production branch: on any other branch the public site is not
# supposed to change, so comparing it to that branch's build would be wrong.
# A schedule is the one trigger that can fire there on its own: GitHub runs
# scheduled workflows from the default branch only, and that is this branch, so
# the build a scheduled run compares against is the deployed one.

on:
  push:
    branches: [Rishika-Damini-Neelam]
  # Daily, not hourly: this is drift detection, not monitoring. A hosting-side
  # rollback, a CDN serving a stale bundle, or a demo credential that stopped
  # working then shows up within a day, with no commit and nothing else to
  # trigger it. A failure here means the deployment that was healthy yesterday
  # no longer answers as this branch's build.
  schedule:
    # Off the hour: GitHub's scheduler queues the :00 runs first.
    - cron: '23 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: post-deploy-smoke-${{ github.ref }}
  # A newer push supersedes an older check: the older one would be asserting
  # against a bundle that is no longer the newest build.
  cancel-in-progress: true

env:
  # Not hard-wired to one domain: set a repository variable to check another.
  PRODUCTION_URL: ${{ vars.PRODUCTION_URL || 'https://frontend-xi-ashy-73.vercel.app' }}
  # One account per role in the access matrix. Set these as repository secrets,
  # not variables: the password is a credential. Each account must belong to a
  # tenant with data, since a page that loads and shows nothing is exactly what
  # these checks are for, and each one is used ONLY for the role it is named
  # after — the script fails the run if the account turns out to have another
  # role, rather than judging it by the wrong row.
  #
  # Empty means "not configured yet": that role's row is skipped with a warning.
  # Setting only one of a pair fails the run, because that is a misconfigured
  # secret rather than an absent one.
  #
  # POST_DEPLOY_DEMO_* is the original single-account slot and is still read as
  # the sales_executive one, so nothing already wired had to be renamed.
  POST_DEPLOY_DEMO_EMAIL: ${{ secrets.POST_DEPLOY_DEMO_EMAIL }}
  POST_DEPLOY_DEMO_PASSWORD: ${{ secrets.POST_DEPLOY_DEMO_PASSWORD }}
  POST_DEPLOY_SALES_EXECUTIVE_EMAIL: ${{ secrets.POST_DEPLOY_SALES_EXECUTIVE_EMAIL }}
  POST_DEPLOY_SALES_EXECUTIVE_PASSWORD: ${{ secrets.POST_DEPLOY_SALES_EXECUTIVE_PASSWORD }}
  POST_DEPLOY_STORE_MANAGER_EMAIL: ${{ secrets.POST_DEPLOY_STORE_MANAGER_EMAIL }}
  POST_DEPLOY_STORE_MANAGER_PASSWORD: ${{ secrets.POST_DEPLOY_STORE_MANAGER_PASSWORD }}
  POST_DEPLOY_ADMIN_EMAIL: ${{ secrets.POST_DEPLOY_ADMIN_EMAIL }}
  POST_DEPLOY_ADMIN_PASSWORD: ${{ secrets.POST_DEPLOY_ADMIN_PASSWORD }}
  POST_DEPLOY_OWNER_EMAIL: ${{ secrets.POST_DEPLOY_OWNER_EMAIL }}
  POST_DEPLOY_OWNER_PASSWORD: ${{ secrets.POST_DEPLOY_OWNER_PASSWORD }}
  # Roles a SCHEDULED run must be able to check. Deliberately not named
  # POST_DEPLOY_REQUIRE_ROLES: the script reads that name from the environment,
  # and a push must not start demanding credentials that are not wired yet.
  # Keep this list in step with the secrets above that actually exist: every role
  # named here has an account wired, so a scheduled run that cannot check one of
  # them is a real failure rather than a missing configuration.
  SMOKE_REQUIRED_ROLES: business_owner,store_manager,sales_executive,admin

jobs:
  public-site:
    name: Public site serves this commit (bundle + API)
    runs-on: ubuntu-latest
    # Generous: most of it is the bundle check waiting for the deploy.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches ci.yml, so the bundle hashed here is the bundle the
          # deployment builds.
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build the frontend
        # Vite content-hashes the entry chunk, so this build's bundle name is an
        # exact fingerprint of this commit's frontend source.
        working-directory: frontend
        run: npm run build

      - name: Read this build's entry bundle
        id: bundle
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          bundle="$(grep -oE '/assets/index-[^\"]+\.js' dist/index.html | head -1)"
          if [ -z "$bundle" ]; then
            echo "::error::no entry bundle found in dist/index.html - the build output is not a Vite SPA shell"
            exit 1
          fi
          echo "this build's entry bundle: $bundle"
          echo "bundle=$bundle" >> "$GITHUB_OUTPUT"

      - name: Smoke check the public deployment
        # Fails if the live bundle is not this build, if the entry bundle is not
        # actually fetchable, if /api/sales/ is answered by the SPA fallback
        # (HTML) rather than by the backend (JSON, 401 when anonymous), if any
        # retired hostname answers 200 with a build instead of redirecting to
        # the canonical origin, or - for every role that has credentials - if
        # that role can load a page it has no business loading, is refused one
        # it should have, or is refused a write it is entitled to make.
        run: |
          args=(
            --url "$PRODUCTION_URL"
            --expected-bundle "${{ steps.bundle.outputs.bundle }}"
            --retired-hosts-file frontend/vercel.json
            --timeout 420
          )
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # On a push a missing secret is a warning: a deploy should not fail
            # because credentials were never configured. A scheduled run is the
            # opposite case - its whole job is to prove the checks still work, so
            # a role named here that has no credentials fails it instead of
            # letting that row vanish from a run that still reports success.
            args+=(--require-roles "$SMOKE_REQUIRED_ROLES")
          fi
          python3 scripts/post_deploy_smoke.py "${args[@]}"
