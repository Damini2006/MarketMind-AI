name: CI

# Runs on every push: backend pytest suite, frontend production build, and a
# Docker image build (validates the backend Dockerfile; nothing is pushed).
on:
  push:
  workflow_dispatch:

jobs:
  backend-tests:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches backend/Dockerfile's python:3.11-slim base so CI tests the
          # same interpreter the deployed image runs on.
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        # pytest is a dev-only dependency: kept out of requirements.txt so the
        # Docker image doesn't ship the test runner. Version matches the suite
        # as verified locally (pytest 9.1.1). No secrets needed — tests/conftest.py
        # points DATABASE_URL at a throwaway SQLite DB before any app import.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest==9.1.1

      - name: Run test suite
        run: python -m pytest tests/ -q

  frontend-build:
    name: Frontend build (vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Vite 8 (frontend/package.json) requires Node >=20.19 / >=22.12;
          # Node 22 LTS matches the local dev version.
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image (no push)
        # Context is ./backend — the Dockerfile does `COPY requirements.txt .`
        # then `COPY . .`, and backend/.dockerignore already excludes .env*,
        # *.db, venv/, uploads/ and tests/ so no secrets land in the image.
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: marketmind-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-smoke:
    name: Deploy smoke test (compose stack)
    runs-on: ubuntu-latest
    # The last gate: bring the whole stack up and exercise it over HTTP the way
    # a client would, instead of trusting that the images built.
    needs: [backend-tests, frontend-build]
    timeout-minutes: 20
    env:
      # compose MERGES env_file lists rather than replacing them, so an overlay
      # cannot swap backend/.env for a CI config — the base file would still
      # require backend/.env, which no runner has. The path is parameterised in
      # docker-compose.yml and selected here. backend/ci.env is checked in and
      # contains no real credentials, so this job needs no secrets at all.
      BACKEND_ENV_FILE: ./backend/ci.env

    steps:
      - uses: actions/checkout@v4

      - name: Start the stack against a throwaway PostgreSQL
        # docker-compose.ci.yml adds a disposable postgres and makes the backend
        # wait for it, so this exercises the real Dockerfiles, the real compose
        # wiring and the real nginx proxy without touching the managed database.
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --build

      - name: Wait for the backend to become healthy
        run: |
          for attempt in $(seq 1 60); do
            container=$(docker compose -f docker-compose.yml -f docker-compose.ci.yml ps -q backend)
            status=$(docker inspect --format '{{.State.Health.Status}}' "$container" 2>/dev/null || echo starting)
            echo "attempt $attempt: $status"
            if [ "$status" = "healthy" ]; then exit 0; fi
            sleep 5
          done
          echo "::error::backend never became healthy"
          exit 1

      - name: Run the deploy smoke test
        # Exits non-zero if /health, /openapi.json, the frontend shell, the
        # nginx /api proxy, an authenticated login, an authenticated API call,
        # or the database round-trip is broken.
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml --profile smoke run --rm smoke

      - name: Dump stack logs
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml logs --no-color --tail 200

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml --profile smoke down -v
